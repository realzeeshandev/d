<!DOCTYPE html>
<html>
<head>
    <title>Keyboard UI</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>

<div class="container">

    <!-- Real Input Field (Typing Works Here) -->
    <input type="text" class="display" placeholder="Start typing...">

    <div class="keyboard">

        <div class="row">
            <button>Q</button>
            <button>W</button>
            <button>E</button>
            <button>R</button>
            <button>T</button>
            <button>Y</button>
            <button>U</button>
            <button>I</button>
            <button>O</button>
            <button>P</button>
        </div>

        <div class="row">
            <button>A</button>
            <button>S</button>
            <button>D</button>
            <button>F</button>
            <button>G</button>
            <button>H</button>
            <button>J</button>
            <button>K</button>
            <button>L</button>
        </div>

        <div class="row">
            <button>Z</button>
            <button>X</button>
            <button>C</button>
            <button>V</button>
            <button>B</button>
            <button>N</button>
            <button>M</button>
        </div>

        <div class="row">
            <button class="space">SPACE</button>
        </div>

    </div>

</div>

</body>
</html>
